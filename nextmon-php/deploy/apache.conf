# NextMON on Apache 2.4 (mod_rewrite, mod_headers, mod_php or php-fpm via proxy_fcgi).
# DocumentRoot MUST be nextmon-php/public. With this vhost AllowOverride can stay None (rules are inlined).
<VirtualHost *:443>
    ServerName nextmon.example.com
    DocumentRoot /var/www/nextmon-php/public
    # SSLEngine on ...

    ServerTokens Prod
    ServerSignature Off
    SetEnv NEXTMON_DATA /var/lib/nextmon
    # SetEnv NEXTMON_TRUSTED_PROXIES "10.0.0.0/8"
    LimitRequestBody 3145728

    <Directory /var/www/nextmon-php/public>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L,QSA]
    </Directory>

    # everything that is not the public folder: never served (belt and braces)
    <DirectoryMatch "^/var/www/nextmon-php/(src|lang|data|bin|tests|deploy|docs)(/|$)">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "^\.|\.(key|db|sqlite3?|log|bak|sql|rsc|backup|md|lock|ini|dist)$">
        Require all denied
    </FilesMatch>
    # only index.php / cron.php execute as PHP
    <FilesMatch "\.php$">
        Require all denied
    </FilesMatch>
    <FilesMatch "^(index|cron)\.php$">
        Require all granted
    </FilesMatch>
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        # content-hashed build from bin/build-assets.js
        <LocationMatch "/assets/dist/(css|js)/">
            Header set Cache-Control "public, max-age=31536000, immutable"
        </LocationMatch>
    </IfModule>
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/css application/javascript image/svg+xml
    </IfModule>
</VirtualHost>
