# NextMON behind nginx + php-fpm.  Document root MUST be nextmon-php/public (never the project folder).
# Replace the fastcgi_pass socket and server_name. Keep TLS on: the session cookie is marked Secure when HTTPS is detected.
server {
    listen 443 ssl http2;
    server_name nextmon.example.com;
    # ssl_certificate / ssl_certificate_key ...

    root /var/www/nextmon-php/public;
    index index.php;
    client_max_body_size 3m;            # CSV import limit is 2 MB
    server_tokens off;

    # defence in depth: these live outside public/ and are not reachable anyway
    location ~ ^/(src|lang|data|bin|tests|deploy|docs)(/|$) { return 404; }
    # dotfiles and anything that looks like data/backup/secret material
    location ~ /\.(?!well-known/) { return 404; }
    location ~* \.(key|db|sqlite3?|log|bak|sql|rsc|backup|md|lock|conf|ini|dist)$ { return 404; }

    location / {
        try_files $uri /index.php?$query_string;
    }

    # only the two entry points may run as PHP (public/index.php and public/cron.php); nothing else can ever execute
    location ~ ^/(index|cron)\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param NEXTMON_DATA /var/lib/nextmon;        # keep data OUTSIDE the code tree (owned by the php-fpm user, mode 0750)
        # fastcgi_param NEXTMON_TRUSTED_PROXIES "10.0.0.0/8";   # only when another proxy sits in front of nginx
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 120s;
    }
    location ~ \.php$ { return 404; }

    # static assets
    # content-hashed build (node bin/build-assets.js): immutable, precompressed (.br/.gz next to each file)
    location /assets/dist/ { expires max; add_header Cache-Control "public, max-age=31536000, immutable"; gzip_static on; # brotli_static on;  (ngx_brotli module)
        try_files $uri =404; }
    location /assets/ { expires 7d; add_header Cache-Control "public"; gzip on; gzip_types text/css application/javascript image/svg+xml; try_files $uri =404; }
}

# If TLS terminates on THIS nginx and NextMON runs behind it (php -S / docker), forward the real client info:
#   proxy_set_header Host $host;
#   proxy_set_header X-Forwarded-For $remote_addr;      # replace, do not append, when nginx is the first hop
#   proxy_set_header X-Forwarded-Proto $scheme;
# and start NextMON with NEXTMON_TRUSTED_PROXIES=<nginx address>, otherwise those headers are ignored on purpose.
