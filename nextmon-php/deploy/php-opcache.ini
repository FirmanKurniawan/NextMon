; OPcache + path-cache settings for NextMON. Not needed for correctness, but it is the single biggest PHP-side speed-up
; (measured with php -S on Windows: a cached page 21 ms -> 6 ms; no OPcache means every request recompiles ~25k lines of PHP).
;
; Windows (XAMPP / winget PHP): php.ini ->  zend_extension=opcache   (php_opcache.dll is in ext\, just not enabled)
;   then add the [opcache] block below.  Linux: usually `apt install php-opcache` (already loaded on most distros).
; php-fpm: drop this file in conf.d/99-nextmon-opcache.ini.   bin/serve.ps1 / bin/serve.sh pass the same values with -d.

[opcache]
opcache.enable = 1
; php -S (cli-server) uses opcache.enable; only the plain CLI (cron.php) needs enable_cli, and a 1-shot script gains nothing from it
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 4000
; development / home use: keep timestamp checks so edits to src/ show up within 2 s
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
; production (deploys via git pull / copy): set validate_timestamps = 0 for the last few % and reload php-fpm after each deploy
; JIT gives nothing for this I/O-bound app and costs memory: keep it off
opcache.jit = off
opcache.jit_buffer_size = 0

; Windows stat() is slow and NextMON includes many small files: cache resolved paths longer
realpath_cache_size = 4096K
realpath_cache_ttl = 600
