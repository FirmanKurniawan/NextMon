; Recommended php.ini overrides for NextMON in production (php-fpm: conf.d/99-nextmon.ini; Docker: copied automatically).
; NextMON itself never shells out, so the process-spawning functions can be disabled outright.
expose_php = Off
display_errors = Off
html_errors = Off
log_errors = On
memory_limit = 128M
max_execution_time = 60
upload_max_filesize = 2M
post_max_size = 3M
max_input_vars = 3000
allow_url_include = Off
disable_functions = exec,passthru,shell_exec,system,popen,proc_open,pcntl_exec,show_source
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
; set session.cookie_secure = 1 when the site is HTTPS only
