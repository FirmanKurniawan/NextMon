<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<!-- no-JS fallback; with JS the page redirects after js/config.js redirectDelaySec -->
<noscript><meta http-equiv="refresh" content="4; url=$(link-redirect)"></noscript>
<title>Berhasil terhubung - {brand}</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
<script>try{var __t=localStorage.getItem('hs_theme');if(__t==='dark'||__t==='light')document.documentElement.setAttribute('data-theme',__t)}catch(e){}</script>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<main class="wrap">
  <section class="card center" aria-labelledby="title">
    <header class="top">
      <div class="brand">
        <img data-logo src="img/logo.svg" alt="">
        <div style="min-width:0;text-align:left">
          <div class="brand-name" data-brand>WiFi</div>
          <div class="brand-tag" data-tagline></div>
        </div>
      </div>
      <button type="button" class="iconbtn" id="theme-btn" aria-label="Ganti tema"></button>
    </header>

    <div class="badge" style="margin:8px auto 16px;width:72px;height:72px" aria-hidden="true"><i data-icon="check" data-class="lg"></i></div>
    <h1 id="title">Berhasil terhubung</h1>
    <p class="lead" role="status">Halo, <strong>$(username)</strong>. Internet sudah aktif untuk perangkat ini.</p>
    <p class="lead">Mengalihkan dalam <span id="count">3</span> detik...</p>

    <div class="actions">
      <a class="btn" href="$(link-redirect)"><i data-icon="arrow"></i>Lanjut sekarang</a>
      <a class="btn secondary" href="$(link-status)"><i data-icon="info"></i>Lihat status koneksi</a>
    </div>
  </section>
  <p class="foot"><span data-brand>WiFi</span> &middot; $(identity)</p>
</main>

<script>var HS = { redirect: '$(link-redirect)' }; if (HS.redirect.indexOf('\x24(') === 0) HS.redirect = '';</script>
<script src="js/config.js"></script>
<script src="js/icons.js"></script>
<script src="js/app.js"></script>
<script>HSApp.initSuccess(HS);</script>
</body>
</html>
