<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<noscript><meta http-equiv="refresh" content="6; url=$(link-redirect)"></noscript>
<title>Pesan sponsor - {brand}</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
<script>try{var __t=localStorage.getItem('hs_theme');if(__t==='dark'||__t==='light')document.documentElement.setAttribute('data-theme',__t)}catch(e){}</script>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<main class="wrap">
  <section class="card" aria-labelledby="ad-title">
    <header class="top">
      <div class="brand">
        <img data-logo src="img/logo.svg" alt="">
        <div style="min-width:0">
          <div class="brand-name" data-brand>WiFi</div>
          <div class="brand-tag" data-tagline></div>
        </div>
      </div>
      <button type="button" class="iconbtn" id="theme-btn" aria-label="Ganti tema"></button>
    </header>

    <img id="ad-img" alt="" hidden style="width:100%;border-radius:12px;margin-bottom:16px">
    <h1 id="ad-title" style="font-size:20px"></h1>
    <p class="lead" id="ad-text"></p>
    <p class="lead">Lanjut dalam <span id="count">5</span> detik...</p>
    <div class="actions"><a class="btn" href="$(link-redirect)"><i data-icon="arrow"></i>Lewati</a></div>
  </section>
</main>

<script>var HS = { redirect: '$(link-redirect)' }; if (HS.redirect.indexOf('\x24(') === 0) HS.redirect = '';</script>
<script src="js/config.js"></script>
<script src="js/icons.js"></script>
<script src="js/app.js"></script>
<script>HSApp.initAdvert(HS);</script>
</body>
</html>
