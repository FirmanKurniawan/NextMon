<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<title>Koneksi terputus - {brand}</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
<script>try{var __t=localStorage.getItem('hs_theme');if(__t==='dark'||__t==='light')document.documentElement.setAttribute('data-theme',__t)}catch(e){}</script>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<main class="wrap">
  <section class="card" aria-labelledby="title">
    <header class="top">
      <div class="brand">
        <img data-logo src="img/logo.svg" alt="">
        <div style="min-width:0">
          <div class="brand-name" data-brand>WiFi</div>
          <div class="brand-tag" data-tagline></div>
        </div>
      </div>
      <button type="button" class="iconbtn" id="theme-btn" aria-label="Ganti tema"></button>
    </header>

    <div class="hero">
      <div class="badge neutral" aria-hidden="true"><i data-icon="wifioff" data-class="lg"></i></div>
      <div style="min-width:0">
        <h1 id="title">Koneksi terputus</h1>
        <p class="lead">Sesi <strong>$(username)</strong> telah diakhiri.</p>
      </div>
    </div>

    <div class="stats">
      <div class="stat wide"><div class="k"><i data-icon="clock" data-class="sm"></i>Lama terhubung</div><div class="v mono">$(uptime)</div></div>
      <div class="stat"><div class="k"><i data-icon="down" data-class="sm"></i>Unduh</div><div class="v">$(bytes-in-nice)</div></div>
      <div class="stat"><div class="k"><i data-icon="up" data-class="sm"></i>Unggah</div><div class="v">$(bytes-out-nice)</div></div>
      $(if session-time-left)<div class="stat"><div class="k"><i data-icon="clock" data-class="sm"></i>Sisa waktu</div><div class="v">$(session-time-left)</div></div>$(endif)
    </div>

    <div class="actions">
      <a class="btn" href="$(link-login)"><i data-icon="login"></i>Masuk lagi</a>
    </div>

    <dl class="meta">
      <dt>Alamat IP</dt><dd>$(ip)</dd>
      <dt>MAC</dt><dd>$(mac)</dd>
    </dl>
  </section>
  <p class="foot"><span data-brand>WiFi</span> &middot; $(identity)</p>
</main>

<script src="js/config.js"></script>
<script src="js/icons.js"></script>
<script src="js/app.js"></script>
<script>HSApp.init();</script>
</body>
</html>
