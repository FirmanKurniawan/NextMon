<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voucher template preview</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: #0f172a; color: #e5e7eb; display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 12px; background: rgba(255,255,255,.07); border-bottom: 1px solid rgba(255,255,255,.14); align-items: end; }
  label { display: flex; flex-direction: column; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #9ca3af; gap: 3px; }
  input, select, button { font: inherit; font-size: 14px; min-height: 36px; padding: 4px 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,.2); background: #111827; color: #f3f4f6; }
  input { width: 120px; }
  button { cursor: pointer; background: #0d9488; border-color: #0d9488; color: #fff; font-weight: 600; }
  iframe { flex: 1; width: 100%; border: 0; background: #fff; }
</style>
</head>
<body>
<header>
  <label>Template
    <select id="tpl">
      <option value="a4-grid.html">A4 grid (27/hal)</option>
      <option value="glass-card.html">Glass card (10/hal)</option>
      <option value="thermal-58.html">Thermal 58mm</option>
      <option value="thermal-80.html">Thermal 80mm</option>
    </select>
  </label>
  <label>Jumlah <input id="count" type="number" min="1" max="500" value="9"></label>
  <label>Brand <input id="brand" value="NextMONNet"></label>
  <label>Harga <input id="price" value="Rp 5.000"></label>
  <label>Durasi <input id="validity" value="1 Hari"></label>
  <label>Profile <input id="profile" value="paket-1hari"></label>
  <label>DNS/IP <input id="dns" value="wifi.net"></label>
  <label>Mode
    <select id="mode"><option value="single">1 kode (user=pass)</option><option value="userpass">User + password</option></select>
  </label>
  <button id="go">Perbarui</button>
  <button id="print">Cetak</button>
</header>
<iframe id="f" title="preview"></iframe>
<script src="qr.js"></script>
<script>
  var $ = function (id) { return document.getElementById(id); };
  function update() {
    var p = new URLSearchParams();
    ['count', 'brand', 'price', 'validity', 'profile', 'dns', 'mode'].forEach(function (k) { p.set(k, $(k).value); });
    $('f').src = $('tpl').value + '?' + p.toString();
  }
  $('go').onclick = update;
  $('tpl').onchange = update;
  $('print').onclick = function () { $('f').contentWindow.focus(); $('f').contentWindow.print(); };
  update();
</script>
</body>
</html>
